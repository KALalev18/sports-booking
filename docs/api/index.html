<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sports Booking API</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
    <style>
        body { margin: 0; background: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
        .banner { background: #2f9e44; color: #fff; padding: 12px 16px; font-size: 0.95rem; }
        .banner a { color: #fff; font-weight: 600; }
    </style>
</head>
<body>
<div class="banner">
    Read-only API docs for <a href="../">Sports Booking</a>. "Try it out" is off here because GitHub Pages has no
    server; run the app locally and open <code>/swagger-ui.html</code> to call the API.
</div>
<div id="swagger"></div>
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
<script>
    SwaggerUIBundle({
        url: "openapi.json",
        dom_id: "#swagger",
        supportedSubmitMethods: [],
        defaultModelsExpandDepth: 0,
        docExpansion: "list"
    });
</script>
</body>
</html>
