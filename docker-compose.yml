# Runs the app against Microsoft SQL Server, as in the original project.
# Usage: copy .env.example to .env, set DB_PASSWORD, then run: docker compose up --build
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -b
      interval: 5s
      timeout: 5s
      retries: 30

  # SQL Server does not create databases on connect, so create SportsDb once
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -C
      - -S
      - db
      - -U
      - sa
      - -P
      - ${DB_PASSWORD}
      - -Q
      - IF DB_ID('SportsDb') IS NULL CREATE DATABASE SportsDb

  app:
    build: .
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: sqlserver
      DB_URL: jdbc:sqlserver://db:1433;database=SportsDb;encrypt=false;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
