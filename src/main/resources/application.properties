spring.application.name=sports-booking
server.port=${PORT:8080}

# PostgreSQL. Locally, Spring Boot starts it from compose.yaml; elsewhere set DB_URL, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booking}
spring.datasource.username=${DB_USERNAME:booking}
spring.datasource.password=${DB_PASSWORD:booking}

# Flyway owns the schema; Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
