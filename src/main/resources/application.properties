# Default profile: in-memory H2 database, filled with demo data on startup.
# Run with the "sqlserver" profile to use Microsoft SQL Server instead.
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:sports;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.use_nationalized_character_data=true

spring.thymeleaf.mode=HTML

# Demo accounts created by DataSeeder when the Users table is empty
app.demo.admin-email=${DEMO_ADMIN_EMAIL:admin@sports.demo}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:admin12345}
app.demo.user-email=${DEMO_USER_EMAIL:user@sports.demo}
app.demo.user-password=${DEMO_USER_PASSWORD:user12345}
