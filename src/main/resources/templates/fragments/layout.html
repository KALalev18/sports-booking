<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content, active, scripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Sports Booking</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<header class="site-header">
    <div class="container">
        <a class="brand" th:href="@{/}">Sports Booking</a>
        <div class="account">
            <th:block sec:authorize="isAnonymous()">
                <a th:href="@{/login}">Log in</a>
                <a th:href="@{/register}">Register</a>
            </th:block>
            <th:block sec:authorize="isAuthenticated()">
                <span class="greeting" sec:authentication="name">user@example.com</span>
                <form th:action="@{/logout}" method="post">
                    <button class="link-button" type="submit">Log out</button>
                </form>
            </th:block>
        </div>
    </div>
</header>
<nav class="main-nav" aria-label="Main">
    <div class="container">
        <a th:href="@{/}" th:classappend="${active == 'search'} ? 'active'">Book a court</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/bookings}"
           th:classappend="${active == 'bookings'} ? 'active'">My bookings</a>
        <a th:href="@{/facilities}" th:classappend="${active == 'facilities'} ? 'active'">Facilities</a>
        <a sec:authorize="hasAnyRole('MANAGER', 'ADMIN')" th:href="@{/manage}"
           th:classappend="${active == 'manage'} ? 'active'">Manage</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}"
           th:classappend="${active == 'admin'} ? 'active'">Users</a>
    </div>
</nav>
<main>
    <div class="container">
        <div class="alert success" th:if="${success}" th:text="${success}">Saved.</div>
        <div class="alert error" th:if="${error}" th:text="${error}">Something went wrong.</div>
        <th:block th:replace="${content}"></th:block>
    </div>
</main>
<footer class="site-footer">
    <div class="container">
        Sports Booking · started as a 2023 school project at VSCPI Burgas, rebuilt in 2026 · demo data only ·
        <a href="/swagger-ui.html">API docs</a>
    </div>
</footer>
<th:block th:replace="${scripts}"></th:block>
</body>
</html>
