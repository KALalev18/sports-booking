<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content, active, scripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Sports</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<header class="site-header">
    <div class="container">
        <a class="brand" th:href="@{/}">Sports</a>
        <form class="search" th:action="@{/search}" method="get" role="search">
            <input type="search" name="q" th:value="${query}" placeholder="Search facilities and products..."
                   aria-label="Search facilities and products">
            <button type="submit">Search</button>
        </form>
        <div class="account">
            <th:block sec:authorize="isAnonymous()">
                <a th:href="@{/login}">Log in</a>
                <a th:href="@{/register}">Register</a>
            </th:block>
            <th:block sec:authorize="isAuthenticated()">
                <span class="greeting" sec:authentication="name">user@example.com</span>
                <a th:href="@{/orders}">My orders</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Admin</a>
                <form th:action="@{/logout}" method="post">
                    <button class="link-button" type="submit">Log out</button>
                </form>
            </th:block>
        </div>
    </div>
</header>
<nav class="main-nav" aria-label="Main">
    <div class="container">
        <a th:href="@{/}" th:classappend="${active == 'home'} ? 'active'">Home</a>
        <a th:href="@{/shop}" th:classappend="${active == 'shop'} ? 'active'">Shop</a>
        <a th:href="@{/facilities}" th:classappend="${active == 'facilities'} ? 'active'">Facilities</a>
        <a th:href="@{/news}" th:classappend="${active == 'news'} ? 'active'">News</a>
        <a th:href="@{/about}" th:classappend="${active == 'about'} ? 'active'">About</a>
    </div>
</nav>
<main>
    <div class="container">
        <div class="alert success" th:if="${success}" th:text="${success}">Saved.</div>
        <div class="alert error" th:if="${error}" th:text="${error}">Something went wrong.</div>
        <th:block th:replace="${content}"></th:block>
    </div>
</main>
<footer class="site-footer">
    <div class="container">
        Sports facilities platform · diploma project, PGKPI Burgas, 2023 · demo data only
    </div>
</footer>
<th:block th:replace="${scripts}"></th:block>
</body>
</html>
