<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section}, '', ~{})}">
<head><title>Construction requests · Admin · Sports</title></head>
<body>
<section class="admin-layout">
    <aside th:replace="~{admin/nav :: nav('constructions')}"></aside>
    <div>
        <div class="admin-header"><h1>Construction requests</h1></div>
        <p th:if="${#lists.isEmpty(constructions)}" class="muted">No requests yet.</p>
        <div class="table-wrap card" th:unless="${#lists.isEmpty(constructions)}">
            <table>
                <thead>
                <tr><th>Date</th><th>From</th><th>Phone</th><th>Type</th><th>Description</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="construction : ${constructions}">
                    <td th:text="${#temporals.format(construction.createdAt, 'dd MMM yyyy')}">Date</td>
                    <td><span th:text="|${construction.firstName} ${construction.lastName}|">Name</span><br>
                        <span class="muted" th:text="${construction.user.email}">email</span></td>
                    <td th:text="${construction.phoneNumber}">Phone</td>
                    <td>
                        <span class="tag" th:if="${construction.reconstruction}"
                              th:text="|Rebuild: ${construction.field.fieldName}|">Rebuild</span>
                        <span class="tag" th:unless="${construction.reconstruction}">New facility</span>
                    </td>
                    <td th:text="${construction.description}">Description</td>
                    <td class="actions">
                        <form th:action="@{/admin/constructions/{id}/delete(id=${construction.constructionId})}"
                              method="post" onsubmit="return confirm('Delete this request?')">
                            <button class="button danger small" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
