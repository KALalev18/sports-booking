<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section}, '', ~{})}">
<head><title>Product · Admin · Sports</title></head>
<body>
<section class="admin-layout">
    <aside th:replace="~{admin/nav :: nav('products')}"></aside>
    <div>
        <div class="admin-header"><h1 th:text="${product.productId == 0} ? 'Add product' : 'Edit product'">Product</h1></div>
        <form class="card card-body form"
              th:action="${product.productId == 0} ? @{/admin/products/new} : @{/admin/products/{id}/edit(id=${product.productId})}"
              th:object="${product}" method="post">
            <label for="productName">Name</label>
            <input id="productName" th:field="*{productName}" maxlength="50" required>
            <div class="field-error" th:errors="*{productName}"></div>

            <label for="productPrice">Price (BGN)</label>
            <input id="productPrice" type="number" step="0.01" min="0.01" th:field="*{productPrice}" required>
            <div class="field-error" th:errors="*{productPrice}"></div>

            <label for="productDescription">Description</label>
            <textarea id="productDescription" th:field="*{productDescription}" maxlength="255" required></textarea>
            <div class="field-error" th:errors="*{productDescription}"></div>

            <label for="imagePath">Image file name (in /img/Equipment)</label>
            <input id="imagePath" th:field="*{imagePath}" placeholder="footballball.jpg">
            <div class="field-error" th:errors="*{imagePath}"></div>

            <div class="actions">
                <button class="button" type="submit">Save</button>
                <a class="button secondary" th:href="@{/admin/products}">Cancel</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
