<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section}, '', ~{})}">
<head><title>Orders · Admin · Sports</title></head>
<body>
<section class="admin-layout">
    <aside th:replace="~{admin/nav :: nav('orders')}"></aside>
    <div>
        <div class="admin-header"><h1>Orders</h1></div>
        <p th:if="${#lists.isEmpty(orders)}" class="muted">No orders yet.</p>
        <div class="table-wrap card" th:unless="${#lists.isEmpty(orders)}">
            <table>
                <thead>
                <tr><th>Date</th><th>Customer</th><th>Product</th><th class="number">Qty</th><th class="number">Total</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy, HH:mm')}">Date</td>
                    <td th:text="${order.user.email}">email</td>
                    <td th:text="${order.product.productName}">Product</td>
                    <td class="number" th:text="${order.productQuantity}">1</td>
                    <td class="number" th:text="|${#numbers.formatDecimal(order.totalPrice, 1, 2)} BGN|">19.99 BGN</td>
                    <td class="actions">
                        <form th:action="@{/admin/orders/{id}/delete(id=${order.orderId})}" method="post"
                              onsubmit="return confirm('Delete this order?')">
                            <button class="button danger small" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
