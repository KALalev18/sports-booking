<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section}, '', ~{})}">
<head><title>Facilities · Admin · Sports</title></head>
<body>
<section class="admin-layout">
    <aside th:replace="~{admin/nav :: nav('fields')}"></aside>
    <div>
        <div class="admin-header">
            <h1>Facilities</h1>
            <a class="button" th:href="@{/admin/fields/new}">Add facility</a>
        </div>
        <div class="table-wrap card">
            <table>
                <thead>
                <tr><th>Name</th><th>City</th><th>Open</th><th class="number">Price / hour</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="field : ${fields}">
                    <td th:text="${field.fieldName}">Name</td>
                    <td th:text="${field.fieldLocation}">City</td>
                    <td th:text="|${field.workingDays}, ${#temporals.format(field.startedWorkingTime, 'HH:mm')}–${#temporals.format(field.finishedWorkingTime, 'HH:mm')}|">Mon–Fri</td>
                    <td class="number" th:text="${field.priceByHour != null} ? |${#numbers.formatDecimal(field.priceByHour, 1, 2)} BGN| : 'Free'">50.00 BGN</td>
                    <td class="actions">
                        <a class="button secondary small" th:href="@{/admin/fields/{id}/edit(id=${field.fieldId})}">Edit</a>
                        <form th:action="@{/admin/fields/{id}/delete(id=${field.fieldId})}" method="post"
                              onsubmit="return confirm('Delete this facility?')">
                            <button class="button danger small" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
