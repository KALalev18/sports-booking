<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section}, '', ~{})}">
<head><title>Products · Admin · Sports</title></head>
<body>
<section class="admin-layout">
    <aside th:replace="~{admin/nav :: nav('products')}"></aside>
    <div>
        <div class="admin-header">
            <h1>Products</h1>
            <a class="button" th:href="@{/admin/products/new}">Add product</a>
        </div>
        <div class="table-wrap card">
            <table>
                <thead>
                <tr><th>Name</th><th>Description</th><th class="number">Price</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.productName}">Name</td>
                    <td th:text="${product.productDescription}">Description</td>
                    <td class="number" th:text="|${#numbers.formatDecimal(product.productPrice, 1, 2)} BGN|">19.99 BGN</td>
                    <td class="actions">
                        <a class="button secondary small" th:href="@{/admin/products/{id}/edit(id=${product.productId})}">Edit</a>
                        <form th:action="@{/admin/products/{id}/delete(id=${product.productId})}" method="post"
                              onsubmit="return confirm('Delete this product?')">
                            <button class="button danger small" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
