<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section}, 'shop', ~{::script})}">
<head><title>Shop · Sports</title></head>
<body>
<section>
    <div class="shop-toolbar">
        <div>
            <h1 class="page-title">Shop</h1>
            <p class="page-lead">Equipment for football, basketball and volleyball.</p>
        </div>
        <button class="button cart-button" type="button" data-cart-open>
            Cart <span class="cart-count" data-cart-count>0</span>
        </button>
    </div>

    <div class="grid">
        <article class="card product" th:each="product : ${products}">
            <img th:if="${product.imagePath}" th:src="@{/img/Equipment/{file}(file=${product.imagePath})}"
                 th:alt="${product.productName}" loading="lazy">
            <div th:unless="${product.imagePath}" class="image-placeholder"></div>
            <div class="card-body">
                <h2 th:text="${product.productName}">Football</h2>
                <div class="price" th:text="|${#numbers.formatDecimal(product.productPrice, 1, 2)} BGN|">19.99 BGN</div>
                <p th:text="${product.productDescription}">Description</p>
                <button class="button" type="button"
                        th:data-id="${product.productId}"
                        th:data-name="${product.productName}"
                        th:data-price="${product.productPrice}"
                        th:data-image="@{/img/Equipment/{file}(file=${product.imagePath})}"
                        data-add-to-cart>Add to cart
                </button>
            </div>
        </article>
    </div>

    <aside class="cart-drawer" data-cart aria-label="Shopping cart">
        <header>
            <h2>Your cart</h2>
            <button class="button secondary small" type="button" data-cart-close>Close</button>
        </header>
        <ul class="cart-items" data-cart-items></ul>
        <footer>
            <div class="cart-total"><span>Total</span><span data-cart-total>0.00 BGN</span></div>
            <form sec:authorize="isAuthenticated()" th:action="@{/orders}" method="post" data-checkout-form>
                <button class="button" type="submit">Place order</button>
            </form>
            <a sec:authorize="isAnonymous()" class="button" th:href="@{/login(next='/shop')}">Log in to check out</a>
            <p class="muted">Prices are checked again on the server when you place the order.</p>
        </footer>
    </aside>
</section>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
