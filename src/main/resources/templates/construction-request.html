<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section}, 'facilities', ~{})}">
<head><title>Request a facility · Sports</title></head>
<body>
<section>
    <h1 class="page-title">Request a facility</h1>
    <p class="page-lead">Ask us to build a new facility or rebuild one that is already listed. Describe the place
        (use the map to find the town and street) and what kind of facility you need.</p>

    <form class="card card-body form wide" th:action="@{/facilities/request}" th:object="${construction}" method="post">
        <div class="row">
            <div>
                <label for="firstName">First name</label>
                <input id="firstName" th:field="*{firstName}" required>
                <div class="field-error" th:errors="*{firstName}"></div>
            </div>
            <div>
                <label for="lastName">Last name</label>
                <input id="lastName" th:field="*{lastName}" required>
                <div class="field-error" th:errors="*{lastName}"></div>
            </div>
        </div>

        <label for="phoneNumber">Phone number</label>
        <input id="phoneNumber" type="tel" th:field="*{phoneNumber}" required>
        <div class="field-error" th:errors="*{phoneNumber}"></div>

        <label for="fieldId">Existing facility to rebuild (optional)</label>
        <select id="fieldId" name="fieldId">
            <option value="">No, this is a new facility</option>
            <option th:each="field : ${fields}" th:value="${field.fieldId}"
                    th:selected="${field.fieldId == selectedFieldId}"
                    th:text="|${field.fieldName} (${field.fieldLocation})|">Facility</option>
        </select>

        <label for="description">Description</label>
        <textarea id="description" th:field="*{description}" maxlength="250" required
                  placeholder="Town, street and the kind of facility you need..."></textarea>
        <div class="field-error" th:errors="*{description}"></div>

        <label>Find the location</label>
        <iframe class="map large" title="Map of Bulgaria" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3002379.334376623!2d23.300162403827045!3d42.70348639641226!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x40a8fec1c85bf089%3A0xa01269bf4c10!2z0JHRitC70LPQsNGA0LjRjw!5e0!3m2!1sen!2sbg!4v1680249144070!5m2!1sen!2sbg"></iframe>

        <div class="actions">
            <button class="button" type="submit">Send request</button>
            <a class="button secondary" th:href="@{/facilities}">Cancel</a>
        </div>
    </form>
</section>
</body>
</html>
