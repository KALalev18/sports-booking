<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section}, '', ~{})}">
<head><title>Search · Sports</title></head>
<body>
<section>
    <h1 class="page-title">Search</h1>
    <p class="page-lead" th:if="${query.isEmpty()}">Type a facility name, a city or a product in the search box.</p>
    <p class="page-lead" th:unless="${query.isEmpty()}"
       th:text="|${#lists.size(fields) + #lists.size(products)} results for “${query}”|">2 results</p>

    <th:block th:unless="${#lists.isEmpty(fields)}">
        <h2>Facilities</h2>
        <div class="table-wrap card">
            <table>
                <tr th:each="field : ${fields}">
                    <td><a th:href="@{/facilities}" th:text="${field.fieldName}">Facility</a></td>
                    <td th:text="${field.fieldLocation}">City</td>
                </tr>
            </table>
        </div>
    </th:block>

    <th:block th:unless="${#lists.isEmpty(products)}">
        <h2>Products</h2>
        <div class="table-wrap card">
            <table>
                <tr th:each="product : ${products}">
                    <td><a th:href="@{/shop}" th:text="${product.productName}">Product</a></td>
                    <td class="number" th:text="|${#numbers.formatDecimal(product.productPrice, 1, 2)} BGN|">19.99 BGN</td>
                </tr>
            </table>
        </div>
    </th:block>
</section>
</body>
</html>
