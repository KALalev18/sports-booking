<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section}, 'home', ~{})}">
<head><title th:text="|${page.name} · Sports|">Service · Sports</title></head>
<body>
<section>
    <div class="with-sidebar">
        <aside class="card sidebar">
            <h2>Our services</h2>
            <ul>
                <li th:each="service : ${services}">
                    <a th:href="@{/services/{slug}(slug=${service.slug})}" th:text="${service.name}"
                       th:classappend="${service.slug == page.slug} ? 'active'">Football pitches</a>
                </li>
            </ul>
        </aside>
        <div>
            <h1 class="page-title" th:text="${page.title}">Service title</h1>
            <p class="page-lead">Sample content from the original site.</p>
            <div class="gallery">
                <img th:each="photo : ${page.photos}" th:src="${photo}" th:alt="${page.name}" loading="lazy">
            </div>
            <div class="card card-body">
                <p th:text="${page.intro}">Intro</p>
                <h3>Services and products we offer</h3>
                <ul>
                    <li th:each="offer : ${offers}" th:text="${offer}">Offer</li>
                </ul>
                <a class="button" th:href="@{/facilities/request}">Request a facility</a>
            </div>
        </div>
    </div>
</section>
</body>
</html>
