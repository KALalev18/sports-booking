<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section}, '', ~{})}">
<head><title>Log in · Sports</title></head>
<body>
<section>
    <div class="card card-body auth-card">
        <h1 class="page-title">Log in</h1>
        <div class="alert error" th:if="${param.error}">Wrong email or password.</div>
        <div class="alert success" th:if="${param.logout}">You have been logged out.</div>

        <form class="form" th:action="@{/login}" method="post">
            <input type="hidden" name="next" th:value="${param.next}">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required autofocus>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <div class="actions">
                <button class="button" type="submit">Log in</button>
            </div>
        </form>
        <p>No account yet? <a th:href="@{/register}">Register</a></p>
        <p class="muted">Demo accounts: <code>user@sports.demo</code> / <code>user12345</code>
            and <code>admin@sports.demo</code> / <code>admin12345</code></p>
    </div>
</section>
</body>
</html>
