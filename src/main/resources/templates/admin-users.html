<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section}, 'admin', ~{})}">
<head><title>Users · Sports Booking</title></head>
<body>
<section>
    <h1 class="page-title">Users</h1>
    <p class="page-lead">Customers book courts, managers run the facilities assigned to them, admins manage
        everything.</p>
    <div class="table-wrap card">
        <table>
            <thead>
            <tr><th>Name</th><th>Email</th><th>Role</th></tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.fullName}">Ana</td>
                <td th:text="${u.email}">ana@example.com</td>
                <td>
                    <form class="inline-form" th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post">
                        <select name="role" th:aria-label="|Role of ${u.email}|">
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == u.role}">CUSTOMER</option>
                        </select>
                        <button class="button secondary small" type="submit">Save</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
